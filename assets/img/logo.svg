<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="816800.xyz logo">
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- 圆角方块底座（暗色，任何背景都可用） -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="17" fill="#09090b" stroke="url(#logo-grad)" stroke-width="3"/>
  <!-- 2x2 工具模块：工具箱 / 模块化工具隐喻 -->
  <g stroke-linejoin="round">
    <rect x="15" y="15" width="14" height="14" rx="4.5" fill="none" stroke="#ffffff" stroke-width="3"/>
    <rect x="35" y="15" width="14" height="14" rx="4.5" fill="url(#logo-grad)"/>
    <rect x="15" y="35" width="14" height="14" rx="4.5" fill="none" stroke="#ffffff" stroke-width="3"/>
    <rect x="35" y="35" width="14" height="14" rx="4.5" fill="none" stroke="#71717a" stroke-width="3"/>
  </g>
</svg>
